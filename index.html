<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>준트리오 | 인하공업전문대학 B구역</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   설정 — 여기만 고치면 됩니다
   ============================================================ */
var CONFIG = {
  apiKey: "37E11865-1EE4-46EB-A352-DFE63DCD7169",   // 브이월드 인증키
  home: {"lon":126.656092,"lat":37.446786,"height":290,"heading":28,"tilt":-34},
  buildings: { "1호관": {"lon":126.657954,"lat":37.447461,"h":20}, "6호관": {"lon":126.657685,"lat":37.448815,"h":32}, "11호관": {"lon":126.658051,"lat":37.446951,"h":13} },
  radius: 45   // 등록 지점에서 이 거리(m) 안을 누르면 그 건물로 봅니다
};
/* ============================================================ */
var STORE = {};
try { STORE = JSON.parse(localStorage.getItem('inhatc_space') || '{}') } catch (e) {}
// CONFIG의 시작 시점이 바뀌면, 브라우저에 저장해 둔 예전 시작 시점은 버립니다
if (STORE.home && STORE.homeBase !== JSON.stringify(CONFIG.home)) { delete STORE.home; }
function saveStore() { try { localStorage.setItem('inhatc_space', JSON.stringify(STORE)) } catch (e) {} }
// 브이월드는 http(s) 주소에서만 인증됩니다. 파일을 직접 열었을 때는 불러오지 않습니다.
var VW_TRY = CONFIG.apiKey && /^https?:$/.test(location.protocol);
if (VW_TRY) document.write('<script src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=' + encodeURIComponent(CONFIG.apiKey) + '"><\/script>');
</script>
<style>
:root{
  --bg:#14161b; --bg2:#1b1e25; --card:#20242c; --card2:#282d37; --line:#333946; --ink:#eef1f6; --ink2:#a3acbb; --ink3:#6f7888;
  --accent:#ffb224; --accent-ink:#1b1400; --accent-soft:rgba(255,178,36,.14); --sky:#5cb0ff; --sky-soft:rgba(92,176,255,.14);
  --green:#4cd08a; --green-soft:rgba(76,208,138,.15); --red:#ff6b5e; --red-soft:rgba(255,107,94,.15); --amber:#ffb224; --amber-soft:rgba(255,178,36,.14);
  --blue:#ffb224; --blue-soft:rgba(255,178,36,.14); --teal:#3fd0c0; --teal-soft:rgba(63,208,192,.14); --muted:#a3acbb; --border:#333946; --panel-alt:#282d37; --ink-soft:#d3d9e3;
  --r:14px; --font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
a{color:inherit}

/* ---------- 상단 내비게이션 ---------- */
.gnb{position:sticky;top:0;z-index:30;background:rgba(20,22,27,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.gnb-in{max-width:1280px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:26px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;border:0;background:none;padding:0;white-space:nowrap}
.logo svg{width:26px;height:26px}
.menu{display:flex;gap:4px;height:100%}
.menu-item{position:relative;display:flex;align-items:center}
.menu-item>button{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--ink2);white-space:nowrap}
.menu-item>button:hover,.menu-item:focus-within>button{color:var(--ink);background:var(--card)}
.menu-item.on>button{color:var(--accent)}
.drop{position:absolute;top:100%;left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.45);display:none}
.menu-item:hover .drop,.menu-item:focus-within .drop{display:block}
.drop h4{margin:6px 10px 4px;font-size:11.5px;color:var(--ink3);font-weight:600}
.drop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:500}
.drop button:hover{background:var(--card2)}
.drop button.active{color:var(--accent);font-weight:700}
.drop small{display:block;color:var(--ink3);font-size:11.5px;font-weight:400}
.gnb .sp{flex:1}
.gsearch{position:relative;flex:0 1 280px}
.srch{width:100%;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--ink)}
.srch::placeholder{color:var(--ink3)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.5);z-index:40;display:none;text-align:left}
.results.on{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}
.results button:hover,.results button:focus-visible{background:var(--card2)}
.results small{display:block;color:var(--ink3);font-size:12px}
.results p{margin:8px 10px;color:var(--ink2);font-size:13px}
.results{max-height:70vh;overflow-y:auto}
.results h5{margin:8px 10px 2px;font-size:11.5px;color:var(--accent);font-weight:700}
.results button .tg{display:inline-block;font-size:11px;font-weight:700;color:var(--sky);background:var(--sky-soft);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.tt-blk.hl{box-shadow:inset 0 0 0 3px #14161b,0 0 0 2px var(--accent)}
.tt-blk.fade{opacity:.28}
.tt-hlbar{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.tt-hlbar button{margin-left:auto}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;color:var(--ink2);font-weight:600;font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.active{background:var(--accent);color:var(--accent-ink)}
.seg button.below{font-style:italic}
.seg small{opacity:.65;font-weight:500;margin-left:3px}

/* ---------- 본문 ---------- */
#content{max-width:1280px;margin:0 auto;padding:26px 20px 70px}
.view{display:none}
.view.active{display:block}
.page-head{margin:4px 0 18px}
.page-head h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.03em}
.page-head p{margin:4px 0 0;color:var(--ink2)}
.hero{text-align:center;padding:34px 0 30px}
.hero h1{font-size:34px;line-height:1.25;margin:0 0 8px;font-weight:800;letter-spacing:-.035em}
.hero p{margin:0 0 22px;color:var(--ink2);font-size:15px}
.hero .gsearch{max-width:560px;margin:0 auto;flex:none}
.hero .srch{padding:15px 24px;font-size:16px;border-width:2px;border-color:var(--accent);background:var(--bg2)}
.hero .quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.grid{display:grid;gap:14px}
.grid.kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.two{grid-template-columns:1.2fr .8fr}
.grid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:980px){.grid.two,.grid.three{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card-head{padding:15px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.card-head h3{font-size:15.5px;margin:0;font-weight:700}
.card-head p{margin:0;font-size:12.5px;color:var(--ink2)}
.card-head .more{margin-left:auto;border:0;background:none;color:var(--ink2);font-size:12.5px;font-weight:600}
.card-head .more:hover{color:var(--accent)}
.card-body{padding:16px 18px}
.kpi-card{padding:16px 18px}
.kpi-card .label{font-size:12.5px;color:var(--ink2);font-weight:500}
.kpi-card .value{font-size:28px;font-weight:800;margin-top:2px;letter-spacing:-.03em}
.kpi-card .value span{font-size:13px;color:var(--ink2);font-weight:500;margin-left:5px;letter-spacing:0}
.kpi-card.accent-blue .value{color:var(--accent)}
.toolbar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar label{font-size:12px;color:var(--ink3);font-weight:600;margin-right:-6px}
.rank{list-style:none;margin:0;padding:0}
.rank li button{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 8px;border-radius:10px}
.rank li button:hover{background:var(--card2)}
.rank .n{font-weight:800;color:var(--ink3);text-align:center}
.rank li:nth-child(-n+3) .n{color:var(--accent)}
.rank .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .t small{display:block;color:var(--ink3);font-weight:400;font-size:12px}
.rank .v{font-weight:700;text-align:right}
.rank .v small{display:block;color:var(--ink3);font-weight:400;font-size:11.5px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--ink2);padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;user-select:none;white-space:nowrap;font-weight:500}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.filter-group h3{font-size:12px;color:var(--ink3);margin:0 0 6px;font-weight:600}
.btn{border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--card2)}
.btn:hover{border-color:var(--ink3)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink3)}
.field select,.field input{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);color:var(--ink);min-width:130px}
.inline-fields{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.bar-row{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;margin:8px 0;font-size:13px;border-radius:8px}
.bar-row .lbl{color:var(--ink-soft);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{background:var(--bg2);border-radius:6px;height:12px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:var(--accent)}
.bar-row .val{text-align:right;color:var(--ink2);font-weight:600}
table.data-table{width:100%;border-collapse:collapse;font-size:13px}
table.data-table th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink3);white-space:nowrap;font-weight:600}
table.data-table td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data-table tbody tr.linkable-row{cursor:pointer}
table.data-table tbody tr.linkable-row:hover{background:var(--card2)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.type-강의실{background:var(--sky-soft);color:var(--sky)}
.badge.type-실습실{background:var(--teal-soft);color:var(--teal)}
.badge.t-etc{background:var(--card2);color:var(--ink2)}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.bad{background:var(--red-soft);color:var(--red)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.note{font-size:12.5px;color:var(--ink2);background:var(--bg2);border-radius:10px;padding:11px 13px;margin-top:12px}
.note b{color:var(--ink)}
.empty-state{padding:36px 20px;text-align:center;color:var(--ink2)}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag-list span{background:var(--card2);border-radius:8px;padding:3px 9px;font-size:12px}
.mini-bar{display:inline-block;width:90px;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:8px}
.mini-bar i{display:block;height:100%;border-radius:4px}

/* ---------- 3D ---------- */
.scene{position:relative;height:600px;overflow:hidden;border-radius:12px;background:radial-gradient(ellipse at 50% 70%,#2a303c,#171a20 70%);perspective:2400px;touch-action:none;cursor:grab}
.scene:active{cursor:grabbing}
.world{position:absolute;left:50%;top:58%;transform-style:preserve-3d}
.bgroup{position:absolute;transform-style:preserve-3d}
.plate{position:absolute;left:0;top:0;transform-style:preserve-3d;background:rgba(255,255,255,.93);outline:1.5px solid #0e1014;cursor:pointer}
.plate svg{display:block;width:100%;height:100%;pointer-events:none}
.bgroup:hover .plate{outline:2.5px solid var(--accent)}
.blabel{position:absolute;left:50%;top:50%;transform-style:preserve-3d;pointer-events:none}
.blabel span{position:absolute;transform:translate(-50%,-100%);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;padding:4px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.site{position:absolute;background:rgba(255,255,255,.04);border:1px dashed #4a5262;border-radius:8px}
.scene-hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--ink3);pointer-events:none}

#bview{scroll-margin-top:76px}
/* ---------- 가동율 ---------- */
.ub-crit{width:100%;border-collapse:collapse;font-size:13px}
.ub-crit td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ub-crit td:first-child{width:22px}
.ub-crit b{font-weight:800}
.ub-crit small{color:var(--ink3)}
.ub-stack{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--bg2)}
.ub-stack span{display:flex;align-items:center;justify-content:center;color:#14161b;font-size:11.5px;font-weight:700;min-width:0}
.ub-brow{display:grid;grid-template-columns:80px 1fr 110px;gap:10px;align-items:center;margin:10px 0}
.ub-brow .v{text-align:right;font-weight:800}
.ub-brow .v small{display:block;font-weight:500;color:var(--ink3);font-size:11px}
.ub-chart{position:relative}
.ub-row{display:grid;grid-template-columns:190px 1fr 56px;gap:10px;align-items:center;width:100%;border:0;background:none;padding:3px 6px;border-radius:7px;text-align:left}
.ub-row:hover{background:var(--card2)}
.ub-row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.ub-row .lb b{margin-right:6px}
.ub-row .lb small{color:var(--ink3)}
.ub-track{position:relative;height:16px;background:var(--bg2);border-radius:5px}
.ub-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.ub-g{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed rgba(255,255,255,.28)}
.ub-row .v{text-align:right;font-weight:800;font-size:12.5px}
.ub-axis{display:grid;grid-template-columns:190px 1fr 56px;gap:10px;padding:0 6px;font-size:11px;color:var(--ink3)}
.ub-axis div{position:relative;height:14px}
.ub-axis span{position:absolute;transform:translateX(-50%)}
@media (max-width:700px){.ub-row,.ub-axis{grid-template-columns:110px 1fr 46px}}
/* ---------- 시간표 ---------- */
.tt-layout{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.tt-layout{grid-template-columns:1fr}}
.tt-list{max-height:76vh;overflow:auto;padding:8px 10px}
.tt-list .cap{font-size:11.5px;color:var(--ink3);margin:2px 6px 6px}
.tt-list h4{font-size:12px;color:var(--ink3);margin:12px 6px 4px;font-weight:600}
.tt-list button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:7px 8px;border-radius:9px;text-align:left}
.tt-list button:hover{background:var(--card2)}
.tt-list button.on{background:var(--accent-soft);color:var(--accent)}
.tt-list .no{font-weight:800;min-width:44px}
.tt-list .nm{flex:1;font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-list .pc{font-size:11.5px;font-weight:700;color:var(--ink2);min-width:38px;text-align:right}
.tt-list .bar{display:block;height:3px;border-radius:2px;background:var(--accent);margin-top:3px;opacity:.7}
.tt-wrap{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:3px;width:100%;min-width:640px;table-layout:fixed}
table.tt th{font-size:12.5px;color:var(--ink2);font-weight:700;padding:6px 0}
table.tt td{height:42px;padding:0;vertical-align:top}
table.tt.sm td{height:34px}
table.tt.sm{min-width:560px}
table.tt td.p{width:54px;font-size:11.5px;color:var(--ink3);text-align:center;vertical-align:middle;background:var(--bg2);border-radius:6px}
table.tt td.e{background:var(--bg2);border-radius:6px;opacity:.5}
table.tt td.f{position:relative}
.tt-cell{position:absolute;inset:0;display:flex;flex-direction:column;gap:3px}
.tt-blk{flex:1;min-height:0;border-radius:7px;padding:5px 7px;color:#14161b;font-size:11.5px;line-height:1.3;overflow:hidden}
.tt-blk b{display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-blk small{display:block;opacity:.72;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-blk.x{box-shadow:inset 0 0 0 2px var(--red)}
tr.tt-div td{font-size:11.5px;color:var(--sky);font-weight:700;padding:8px 4px 2px}
table.ttday{border-collapse:separate;border-spacing:2px;width:100%;table-layout:fixed;min-width:760px}
table.ttday th{font-size:12px;color:var(--ink2);font-weight:700;padding:4px 0;text-align:center}
table.ttday th.rm{width:150px;text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
table.ttday th.rm button{border:0;background:none;padding:3px 4px;text-align:left;font-weight:800;width:100%;border-radius:7px}
table.ttday th.rm button:hover{background:var(--card2)}
table.ttday th.rm small{display:block;font-weight:500;color:var(--ink3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.ttday td{height:36px;padding:0}
table.ttday td.e{background:var(--bg2);border-radius:5px;opacity:.5}
table.ttday .nb{border-left:2px solid var(--sky)}
.ttd-blk{width:100%;height:100%;border:0;border-radius:6px;color:#14161b;font-size:11.5px;font-weight:600;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.ttd-blk:hover{filter:brightness(1.08)}
.ttd-blk.x{box-shadow:inset 0 0 0 2px var(--red)}
table.ttday td.fr{text-align:center;font-size:12px;font-weight:700;color:var(--green)}
table.ttday tfoot th,table.ttday tfoot td{padding-top:6px}
#vmap{height:min(76vh,780px);min-height:520px;border-radius:12px;overflow:hidden;background:#0e1014}
#smap{height:min(76vh,780px);min-height:520px;border-radius:12px;overflow:hidden;background:#dfe3e8;font-family:var(--font)}
#smap .leaflet-control-attribution{font-size:10.5px}
.smk{background:none;border:0}
.smk-in{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 9px));background:var(--accent);color:var(--accent-ink);padding:5px 11px 6px;border-radius:10px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35);font-family:var(--font);cursor:pointer;line-height:1.25;transition:transform .15s ease}
.smk-in:hover{transform:translate(-50%,calc(-100% - 12px))}
.smk-in b{display:block;font-size:13.5px;font-weight:800}
.smk-in small{font-size:11px;opacity:.8}
.smk-in:after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-bottom:0;border-top-color:var(--accent)}

.wall,.roof{position:absolute;left:0;top:0;transform-origin:0 0;opacity:calc(1 - var(--t));pointer-events:none}
.wall{background:linear-gradient(var(--band) 0 7%,transparent 7%),linear-gradient(var(--wall) 0 26%,transparent 26% 74%,var(--wall) 74%),repeating-linear-gradient(90deg,var(--wall) 0 var(--wg),var(--glass) var(--wg) calc(var(--wg) + var(--ww)));box-shadow:inset 0 0 0 1px rgba(14,16,20,.28)}

.wall.below{background:#727a88}

.btiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

const LTILES={vw:{u:'https://api.vworld.kr/req/wmts/1.0.0/'+VWK+'/Base/{z}/{y}/{x}.png',a:'&copy; 국토교통부 브이월드',z:19,vw:1},
  vsat:{u:'https://api.vworld.kr/req/wmts/1.0.0/'+VWK+'/Satellite/{z}/{y}/{x}.jpeg',a:'&copy; 국토교통부 브이월드',z:19,vw:1,
    over:'https://api.vworld.kr/req/wmts/1.0.0/'+VWK+'/Hybrid/{z}/{y}/{x}.png'},
  osm:{u:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',a:'&copy; OpenStreetMap',z:19}};
const LBASES=[['vw','브이월드'],['vsat','브이월드 위성'],['osm','OpenStreetMap']];
let lover=null, lerr=0, lfell=false;
const curBase=()=>LTILES[STORE.sbase]?STORE.sbase:'vw';
const viewSeg=()=>'<div class="seg" role="group" aria-label="지도 종류">'+[['3d','3D 지도'],['2d','간단한 지도']].map(v=>'<button data-mapview="'+v[0]+'" class="'+(S.mapView===v[0]?'active':'')+'">'+v[1]+'</button>').join('')+'</div>';
function initSimpleMap(){
  if(lmap||!window.L) return;
  lmap=L.map('smap',{zoomControl:true,attributionControl:true,minZoom:13,maxZoom:19});
  setBase(curBase()); drawSimpleMarkers(); fitSimple();
}
function setBase(k){ if(!lmap) return; const t=LTILES[k]||LTILES.osm; if(lbase) lmap.removeLayer(lbase); if(lover){lmap.removeLayer(lover); lover=null}
  lerr=0; let ok=0;
  lbase=L.tileLayer(t.u,{maxZoom:t.z,maxNativeZoom:t.z,attribution:t.a}).addTo(lmap);
  if(t.over) lover=L.tileLayer(t.over,{maxZoom:t.z,maxNativeZoom:t.z}).addTo(lmap);
  lbase.on('tileload',()=>{ok++});
  // 브이월드 타일이 계속 실패하면(인증키·주소 문제) OpenStreetMap으로 바꿉니다
  if(t.vw) lbase.on('tileerror',()=>{ if(++lerr>=6&&ok===0&&!lfell){ lfell=true; STORE.sbase='osm'; saveStore(); setBase('osm'); drawMapHud();
    setMsg('<b>브이월드 2D 지도를 불러오지 못해 OpenStreetMap으로 바꿨습니다.</b> OpenStreetMap에는 일부 건물(예: 11호관)이 그려져 있지 않을 수 있습니다. <code>start.bat</code>으로 열었는지, 인증키에 등록한 주소가 '+esc(location.origin)+'인지 확인해 주세요.','err') } }) }
function drawSimpleMarkers(){ if(!lmap) return;
  BIDS.forEach(b=>{ const p=bpos(b); if(lmarks[b]){lmap.removeLayer(lmarks[b]); delete lmarks[b]} if(!p) return; const st=bStat(b);
    const m=L.marker([p.lat,p.lon],{title:BNAME[b],keyboard:true,icon:L.divIcon({className:'smk',iconSize:[0,0],
      html:'<span class="smk-dot"></span><div class="smk-in"><b>'+esc(BNAME[b])+'</b><small>'+st.floors+'개 층 · 실 '+st.rooms+'곳 · 눌러서 3D</small></div>'})}).addTo(lmap);
    m.on('click',()=>openB(b)); lmarks[b]=m }) }
function fitSimple(){ if(!lmap) return; const pts=BIDS.map(bpos).filter(Boolean).map(p=>[p.lat,p.lon]);
  if(pts.length) lmap.fitBounds(L.latLngBounds(pts).pad(1.4),{maxZoom:18}); else lmap.setView([CONFIG.home.lat,CONFIG.home.lon],17) }
let mapInited=false;
function ensureMap(){ if(mapInited||!VW_TRY||mapState==='fail') return; mapInited=true;
  try{initMap()}catch(err){mapState='fail';console.error(err)} }
function showMapView(){
  const two=S.mapView==='2d';
  Q('#smap').hidden=!two;
  if(two){ Q('#vmap').hidden=true; Q('#fallback3d').hidden=true; initSimpleMap();
    if(lmap) setTimeout(()=>{lmap.invalidateSize(); drawSimpleMarkers()},40); return }
  if(viewer||mapState==='loading'){ Q('#vmap').hidden=false; Q('#fallback3d').hidden=true; if(!mapInited){ ensureMap(); drawMapHud(); if(!viewer&&mapState!=='loading') drawFallback() } } else drawFallback();
}
function drawMapHud(){
  if(S.mapView==='2d'){
    Q('#map-sub').textContent='간단한 지도 · 건물 표시를 누르면 그 건물만 3D로 보여 줍니다';

      '<div class="seg" role="group" aria-label="바탕 지도">'+LBASES.map(v=>'<button data-sbase="'+v[0]+'" class="'+(curBase()===v[0]?'active':'')+'">'+v[1]+'</button>').join('')+'</div>'+
      '<button class="btn" id="sfitBtn">학교로</button>';
    if(!window.L) setMsg('<b>간단한 지도를 불러오지 못했습니다.</b> 인터넷 연결을 확인해 주세요. 위쪽 「3D 지도」로 돌아가면 약식 3D를 볼 수 있습니다.','err');
    else if(!lfell) setMsg((curBase()==='osm'?'OpenStreetMap 2D 지도입니다. 이 지도에는 일부 건물이 그려져 있지 않을 수 있습니다.':'브이월드 2D 지도(국토교통부 자료)입니다.')+' 끌어서 이동, 휠로 확대합니다. 건물 위치는 3D 지도에서 등록한 위치를 그대로 씁니다.');
    return }
  Q('#map-sub').textContent=viewer?'브이월드 3D 지도 · 건물을 누르면 그 건물만 3D로 보여 줍니다':(mapState==='loading'?'':'약식 3D (브이월드 지도 꺼짐)');
  Q('#map-tools').innerHTML=viewSeg()+'<div class="seg" role="group" aria-label="건물 바로 열기">'+BIDS.map(b=>'<button data-openb="'+b+'">'+b+'</button>').join('')+'</div>'+
    (viewer?'<div class="seg" role="group" aria-label="지도 화질" title="화면이 버벅이면 낮춰 주세요">'+[['high','고화질'],['mid','보통'],['low','가볍게']].map(q=>'<button data-mapq="'+q[0]+'" class="'+(mapQ()===q[0]?'active':'')+'">'+q[1]+'</button>').join('')+'</div><button class="btn" id="regBtn">건물 위치 등록</button><button class="btn" id="homeBtn">처음 시점</button><button class="btn" id="setHomeBtn">이 시점을 시작 위치로</button><button class="btn" id="codeBtn">설정 코드</button>':'');
  const left=BIDS.filter(b=>!bpos(b));
  if(registering) setMsg('<b>'+esc(BNAME[registering])+'</b>을(를) 지도에서 한 번 눌러 주세요. 그만두려면 Esc.','act');
  else if(mapState==='loading') setMsg('3D 지도를 불러오는 중입니다.');
  else if(mapState==='off') setMsg('<b>브이월드 3D 지도가 꺼져 있습니다 — 파일을 더블클릭으로 열었기 때문입니다.</b> 지금 주소가 <code>file://</code>로 시작해서 브이월드 인증이 되지 않아, 아래에는 약식 3D만 나옵니다.<ol><li>이 파일이 있는 폴더의 주소창에 <code>cmd</code>를 입력하고 Enter</li><li><code>python -m http.server 8000</code> 입력하고 Enter (창은 닫지 않기)</li><li>크롬에서 <code>http://localhost:8000/</code>을 열고 이 파일 이름을 누르기</li></ol>','err');
  else if(mapState==='fail') setMsg('<b>브이월드 지도를 불러오지 못해 약식 3D를 보여 줍니다.</b> 인증키에 등록한 서비스 URL이 지금 주소('+esc(location.origin)+')와 같은지, 인터넷이 되는지 확인해 주세요.','err');
  else if(left.length) setMsg('<b>'+left.join(', ')+'</b>의 지도 위치가 아직 없습니다. 「건물 위치 등록」을 누른 뒤 지도에서 건물을 차례로 눌러 주세요. 등록 전에도 위쪽 건물 이름 버튼으로 열 수 있습니다.');
  else setMsg('지도에서 1호관 · 6호관 · 11호관을 누르면 그 건물만 3D로 봅니다. 다른 PC에서도 쓰려면 「설정 코드」 내용을 파일 맨 위 CONFIG에 붙여 넣으세요.');
}
function initMap(){
  const h=STORE.home||CONFIG.home;
  vmapObj=new vw.Map();
  vmapObj.setOption({mapId:'vmap',initPosition:new vw.CameraPosition(new vw.CoordZ(h.lon,h.lat,h.height),new vw.Direction(h.heading||0,h.tilt||-42,0)),logo:true,navigation:true});
  vmapObj.start();
  let tries=0; (function wait(){
    if(window.ws3d&&ws3d.viewer&&window.Cesium){viewer=ws3d.viewer;mapState='ok';onMapReady()}
    else if(++tries<100) setTimeout(wait,200);
    else {mapState='fail'; if(S.tab==='map') draw()}
  })();
}
/* 지도 화질: 브이월드 3D(Cesium) 화면 설정을 올립니다. 버전마다 없는 설정이 있어 하나씩 확인하고 적용합니다 */
const QL={high:{res:1,sse:1,tsse:2,cache:1000,aa:true,msaa:4},mid:{res:1,sse:1.5,tsse:6,cache:500,aa:true,msaa:2},low:{res:.8,sse:2,tsse:16,cache:100,aa:false,msaa:1}};
const mapQ=()=>STORE.q||'high';
function tunePrims(col,q,depth){ if(!col||depth>3) return;
  try{ const n=col.length; if(typeof n!=='number') return;
    for(let i=0;i<n;i++){ const pr=col.get(i); if(!pr) continue;
      if('maximumScreenSpaceError' in pr) pr.maximumScreenSpaceError=q.tsse;
      if('maximumMemoryUsage' in pr) pr.maximumMemoryUsage=Math.max(pr.maximumMemoryUsage||0,q.tsse<=2?1024:512);
      if('skipLevelOfDetail' in pr&&q.tsse<=2) pr.skipLevelOfDetail=false;
      if(typeof pr.get==='function'&&typeof pr.length==='number') tunePrims(pr,q,depth+1) } }catch(e){} }
function applyQuality(){
  if(!viewer) return; const q=QL[mapQ()]||QL.high, sc=viewer.scene, dpr=Math.min(window.devicePixelRatio||1,2);
  const tryDo=f=>{try{f()}catch(e){}};
  // 선명도: 고해상도 화면(배율 125%·150% 등)에서 흐릿하게 그리지 않도록 실제 화소 수로 그립니다
  tryDo(()=>{ if('useBrowserRecommendedResolution' in viewer){viewer.useBrowserRecommendedResolution=mapQ()==='low'; viewer.resolutionScale=q.res}
              else viewer.resolutionScale=mapQ()==='low'?q.res:dpr });
  // 지형·항공사진 타일을 더 촘촘하게(값이 작을수록 고화질)
  tryDo(()=>{sc.globe.maximumScreenSpaceError=q.sse});
  tryDo(()=>{sc.globe.tileCacheSize=q.cache});
  tryDo(()=>{sc.globe.preloadSiblings=q.sse<2; sc.globe.preloadAncestors=true});
  // 계단 현상 줄이기
  tryDo(()=>{ if('msaaSamples' in sc) sc.msaaSamples=q.msaa });
  tryDo(()=>{ if(sc.postProcessStages&&sc.postProcessStages.fxaa) sc.postProcessStages.fxaa.enabled=q.aa; else if('fxaa' in sc) sc.fxaa=q.aa });
  // 3D 건물 모델을 멀리서도 자세한 단계로
  tunePrims(sc.primitives,q,0);
  tryDo(()=>{ viewer.imageryLayers&&Array.from({length:viewer.imageryLayers.length},(_,i)=>viewer.imageryLayers.get(i)).forEach(l=>{ if('minificationFilter' in l&&window.Cesium.TextureMinificationFilter) l.minificationFilter=Cesium.TextureMinificationFilter.LINEAR }) });
  tryDo(()=>{ sc.requestRender&&sc.requestRender() });
}
function onMapReady(){
  applyQuality();
  // 브이월드가 건물 모델을 나중에 불러오므로 처음 20초 동안 몇 번 더 적용하고, 화면을 움직일 때마다 다시 확인합니다
  [1500,4000,8000,14000,20000].forEach(t=>setTimeout(applyQuality,t));
  try{ viewer.camera.moveEnd.addEventListener(()=>tunePrims(viewer.scene.primitives,QL[mapQ()]||QL.high,0)) }catch(e){}
  BIDS.forEach(addMarker); if(S.tab==='map'&&!S.bview){drawMapHud(); showMapView()}
  viewer.screenSpaceEventHandler.setInputAction(function(mv){
    const picked=viewer.scene.pick(mv.position);
    if(Cesium.defined(picked)&&picked.id&&picked.id.inhatc&&!registering){openB(picked.id.inhatc);return}
    const p=clickLonLat(mv.position); if(!p) return;
    if(registering){STORE.pos=STORE.pos||{};STORE.pos[registering]=p;saveStore();addMarker(registering);drawSimpleMarkers();registering=BIDS.find(b=>!bpos(b))||null;drawMapHud();return}
    const b=nearest(p); if(b) openB(b);
  },Cesium.ScreenSpaceEventType.LEFT_CLICK);
}
function clickLonLat(sp){
  let c=null; const sc=viewer.scene;
  try{ if(sc.pickPositionSupported) c=sc.pickPosition(sp) }catch(e){}
  if(!Cesium.defined(c)){ try{ c=sc.globe.pick(viewer.camera.getPickRay(sp),sc) }catch(e){} }
  if(!Cesium.defined(c)) return null;
  const g=Cesium.Cartographic.fromCartesian(c);
  return {lon:+Cesium.Math.toDegrees(g.longitude).toFixed(6),lat:+Cesium.Math.toDegrees(g.latitude).toFixed(6),h:Math.round(g.height)}
}
function addMarker(b){
  const p=bpos(b); if(!p||!viewer) return;
  if(markers[b]) viewer.entities.remove(markers[b]);
  markers[b]=viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(p.lon,p.lat,(p.h||20)+12),
    point:{pixelSize:11,color:Cesium.Color.fromCssColorString('#ffb224'),outlineColor:Cesium.Color.BLACK,outlineWidth:2,disableDepthTestDistance:Number.POSITIVE_INFINITY},
    label:{text:BNAME[b],font:'bold 15px sans-serif',fillColor:Cesium.Color.fromCssColorString('#ffb224'),outlineColor:Cesium.Color.BLACK,outlineWidth:4,
      style:Cesium.LabelStyle.FILL_AND_OUTLINE,verticalOrigin:Cesium.VerticalOrigin.BOTTOM,pixelOffset:new Cesium.Cartesian2(0,-14),disableDepthTestDistance:Number.POSITIVE_INFINITY}});
  markers[b].inhatc=b;
}
function goHome(){const h=STORE.home||CONFIG.home; if(!viewer) return;
  viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(h.lon,h.lat,h.height),orientation:{heading:Cesium.Math.toRadians(h.heading||0),pitch:Cesium.Math.toRadians(h.tilt||-42),roll:0},duration:1.2})}
function setHome(){ if(!viewer) return; const g=viewer.camera.positionCartographic;
  STORE.homeBase=JSON.stringify(CONFIG.home); STORE.home={lon:+Cesium.Math.toDegrees(g.longitude).toFixed(6),lat:+Cesium.Math.toDegrees(g.latitude).toFixed(6),height:Math.round(g.height),
    heading:Math.round(Cesium.Math.toDegrees(viewer.camera.heading)),tilt:Math.round(Cesium.Math.toDegrees(viewer.camera.pitch))}; saveStore(); setMsg('지금 시점을 시작 위치로 저장했습니다.')}
function configCode(){const h=STORE.home||CONFIG.home;
  return '  home: '+JSON.stringify(h)+',\n  buildings: { '+BIDS.map(b=>'"'+b+'": '+JSON.stringify(bpos(b))).join(', ')+' },'}
function openB(b){S.bview=b;S.bz=REDUCE?1:.74;S.bzT=1;S.gapNow=S.gap2;S.tab='map';draw();zoomTo(1);const el=Q('#bview');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'})}

/* ================= 탭 2~6 ================= */
function renderPlan(){ Q('#view-plan').innerHTML=pageHead('층별 평면도','건물과 층을 고르고, 실을 누르면 면적·용도·소속이 팝업으로 뜹니다.')+toolbar(true)+planCard(S.color); applyZoom() }
const typeBadge=t=>'<span class="badge '+(t==='강의실'||t==='실습실'?'type-'+t:'t-etc')+'">'+esc(t)+'</span>';

/* ================= 시간표 (확정자료 엑셀) ================= */
const TTD=['월','화','수','목','금'], TTB=['1호관','6호관','11호관'];
const TTFL=f=>{const m=/^지하(\d)/.exec(f); if(m) return -(+m[1]); const n=parseInt(f,10); return isNaN(n)?99:n};
const TTPAL=['#8fb4f5','#7fd3cb','#f3d58a','#d9b3e3','#f7b0a8','#c9dfa8','#a9b4f0','#e6a96f','#9fd0a5','#e8a3c4','#b9d4e8','#d9c7a0','#c2c8ce','#f0c9a0','#b5e0f0','#e0c3f5'];
const ttC=i=>TTPAL[i%TTPAL.length];
function ttRooms(b){return Object.keys(TTX.rooms).filter(k=>k.split('|')[0]===b).map(k=>Object.assign({k:k,no:k.split('|')[1]},TTX.rooms[k]))
  .sort((p,q)=>TTFL(p.fl)-TTFL(q.fl)||p.no.localeCompare(q.no,'ko',{numeric:true}))}
function ttCells(R){const m={}; R.sl.forEach(s=>{const o={d:s[0],p:s[1],sj:TTX.S[s[2]],dp:TTX.D[s[3]],di:s[3],g:s[4],sec:s[5],n:s[6]}; (m[o.d+'|'+o.p]=m[o.d+'|'+o.p]||[]).push(o)}); return m}
const ttSig=a=>a?a.map(o=>o.sj+'/'+o.dp+'/'+o.g+'/'+o.sec).sort().join('|'):'';
const ttTip=o=>o.sj+' · '+o.dp+' '+o.g+'학년 '+o.sec+'반 · '+o.n+'명';
function planRoom(k){const q=k.split('|'); return ROOMS.find(r=>r.b===q[0]&&r.no===q[1]&&!r.off)}
function ttBlk(list,span,compact){const x=list.length>1, hl=S.ttHL!=null?TTX.S[S.ttHL]:null;
  return '<div class="tt-cell">'+list.map(o=>'<div class="tt-blk'+(x?' x':'')+(hl?(o.sj===hl?' hl':' fade'):'')+'" style="background:'+ttC(o.di)+'" title="'+esc(ttTip(o))+'"><b>'+esc(o.sj)+'</b>'+
    ((compact&&span<2)||(x&&span<2)?'':span<2?'<small>'+o.g+'학년 '+esc(o.sec)+'반 · '+o.n+'명</small>':'<small>'+esc(o.dp)+'</small><small>'+o.g+'학년 '+esc(o.sec)+'반 · '+o.n+'명</small>')+'</div>').join('')+'</div>'}
function ttGrid(k,span,compact){ // 요일 × 교시 표. 같은 수업이 이어지면 한 칸으로 합칩니다
  const R=TTX.rooms[k]; if(!R) return ''; const m=ttCells(R), pr=SPANP[span]||SPANP.day, minP=pr[0], maxP=pr[1], cov={};
  let h='<div class="tt-wrap"><table class="tt'+(compact?' sm':'')+'"><thead><tr><th style="width:54px"></th>'+TTD.map(d=>'<th>'+d+'</th>').join('')+'</tr></thead><tbody>';
  if(span==='night'&&R.nd===0) return '<div class="empty-state">이 방은 야간(10~16교시)에 배정된 수업이 없습니다.</div>';
  for(let p=minP;p<=maxP;p++){
    if(p===10&&minP<10) h+='<tr class="tt-div"><td colspan="6">야간 · 10교시부터</td></tr>';
    h+='<tr><td class="p">'+p+'교시</td>';
    TTD.forEach(d=>{ if(cov[d+'|'+p]) return; const a=m[d+'|'+p];
      if(!a){h+='<td class="e"></td>';return}
      let span=1; const sg=ttSig(a), lim=p<=9?9:maxP;
      while(p+span<=lim&&ttSig(m[d+'|'+(p+span)])===sg){cov[d+'|'+(p+span)]=1;span++}
      h+='<td class="f" rowspan="'+span+'">'+ttBlk(a,span,compact)+'</td>'});
    h+='</tr>'}
  return h+'</tbody></table></div>'}
function ttHasX(R){const m=ttCells(R); return Object.keys(m).some(k=>m[k].length>1)}
function ttStatHTML(R){

    document.querySelectorAll('.results').forEach(x=>x.classList.remove('on')); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
    if(go){S.ttMode='room'; if(b.closest('#modal-bg')) S.ttSpan='all'} S.tab='tt'; closeModal(); draw(); if(go) window.scrollTo(0,0); return}
  if(b=c('[data-ttb]')){S.ttB=b.dataset.ttb; S.ttRoom=null; draw(); return}
  if(b=c('[data-ttmode]')){S.ttMode=b.dataset.ttmode; draw(); return}
  if(b=c('[data-ttspan]')){S.ttSpan=b.dataset.ttspan; draw(); return}
  if(b=c('[data-ttday]')){S.ttDay=b.dataset.ttday; draw(); return}
  if(t.id==='goUtil'){S.tab='tt';S.ttMode='util';draw();window.scrollTo(0,0);return}
  if(b=c('[data-uband]')){const i=+b.dataset.uband; S.utilF=S.utilF===i?null:i; draw(); return}
  if(b=c('[data-ttplan]')){jump(b.dataset.ttplan); window.scrollTo(0,0); return}
  if(b=c('[data-tab]')){S.tab=b.dataset.tab;if(S.tab==='campus'){S.typeF=S.deptF=null}if(S.tab==='map')S.bview=null;if(document.activeElement)document.activeElement.blur();draw();window.scrollTo(0,0);return}
  if(b=c('[data-b]')){S.b=b.dataset.b;const fs=PLAN.buildings.find(q=>q.id===S.b).floors;S.f=(fs.find(f=>f.id==='1F')||fs[0]).id;S.sel=null;if(S.tab==='campus')S.tab='plan';draw();return}
  if(b=c('.seg [data-f]')){S.f=b.dataset.f;S.sel=null;S.tab='plan';draw();return}
  if(b=c('[data-color]')){S.color=b.dataset.color;S.typeF=S.deptF=S.utilF=null;if(S.tab!=='map')S.tab='plan';draw();return}
  if(b=c('[data-zoom]')){S.zoom=Math.max(1,Math.min(4,S.zoom*(b.dataset.zoom==='1'?1.4:1/1.4)));applyZoom();return}
  if(b=c('.plan-wrap .room')){if(!pmoved) roomModal(b.dataset.k);return}
  if(b=c('[data-pview]')){S.pview=b.dataset.pview;draw();return}
  if(b=c('[data-bz]')){zoomTo(S.bzT*(b.dataset.bz==='1'?1.3:1/1.3));return}
  if(b=c('#scene2 .plate')){if(!moved){ if(S.bzT<1.3){zoomTo(1.5)} else {S.b=S.bview;S.f=b.dataset.f;S.sel=null;S.tab='plan';draw();window.scrollTo(0,0)} }return}
  if(b=c('.bgroup')){if(!moved)openB(b.dataset.bldg);return}
  if(t.id==='backBtn'){S.bview=null;draw();return}
  if(t.id==='regBtn'){ if(!BIDS.some(k=>!bpos(k))){STORE.pos={};saveStore();Object.keys(markers).forEach(k=>viewer.entities.remove(markers[k]));markers={};BIDS.forEach(k=>{CONFIG.buildings[k]=null})} registering=BIDS.find(k=>!bpos(k));drawMapHud();return}
  if(b=c('[data-mapq]')){STORE.q=b.dataset.mapq;saveStore();applyQuality();drawMapHud();return}
  if(b=c('[data-mapview]')){S.mapView=b.dataset.mapview;STORE.mapView=S.mapView;saveStore();registering=null;drawMapHud();showMapView();return}
  if(b=c('[data-sbase]')){STORE.sbase=b.dataset.sbase;lfell=false;saveStore();setBase(STORE.sbase);drawMapHud();return}
  if(t.id==='sfitBtn'){fitSimple();return}
  if(t.id==='homeBtn'){goHome();return}
  if(t.id==='setHomeBtn'){setHome();return}
  if(t.id==='codeBtn'){const ta=Q('#code');ta.hidden=false;ta.value=configCode();ta.select();if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>setMsg('설정 코드를 복사했습니다. 파일 맨 위 CONFIG의 home과 buildings 자리에 붙여 넣으세요.'),()=>setMsg('아래 상자의 내용을 직접 복사해 주세요.'));return}
  if(b=c('[data-gofloor]')){const p=b.dataset.gofloor.split('|');S.b=p[0];S.f=p[1];S.sel=null;S.tab='plan';closeModal();draw();window.scrollTo(0,0);return}
  if(b=c('[data-godept]')){const d=b.dataset.godept; if(d[0]==='(')return; S.color='dept';S.deptF=d;const r=ROOMS.find(q=>dept(q)===d&&!q.off);if(r){S.b=r.b;S.f=r.f}S.tab='plan';draw();return}
  if(b=c('[data-type]')){S.typeF=S.typeF===b.dataset.type?null:b.dataset.type;draw();return}
  if(b=c('[data-dept]')){S.deptF=S.deptF===b.dataset.dept?null:b.dataset.dept;draw();return}
  if(b=c('[data-openb]')){openB(b.dataset.openb);return}
  if(b=c('[data-drill]')){const p=b.dataset.drill.split('|'); S.drill=(S.drill&&S.drill.kind===p[0]&&S.drill.val===p[1])?null:{kind:p[0],val:p[1],b:null,fresh:true}; draw(); const el=Q('#drill'); if(el) el.scrollIntoView({block:'nearest'}); return}
  if(b=c('[data-drillb]')){S.drill.b=S.drill.b===b.dataset.drillb?null:b.dataset.drillb; draw(); return}
  if(t.id==='drillClose'){S.drill=null;draw();return}
  if(b=c('[data-room]')){roomModal(b.dataset.room);return}
  if(b=c('[data-k]')){document.querySelectorAll('.results').forEach(x=>x.classList.remove('on'));jump(b.dataset.k);return}
  if(!c('.gsearch')) document.querySelectorAll('.results').forEach(x=>x.classList.remove('on'));
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(registering){registering=null;drawMapHud()}closeModal();document.querySelectorAll('.results').forEach(x=>x.classList.remove('on'))}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{
  if(e.target.id==='gap2'){S.gap2=+e.target.value;zoomTo(Math.max(S.bzT,1.5))}
  if(e.target.id==='wallH'){ S.wallH=+e.target.value; const v=Q('#wallHv'); if(v) v.textContent=S.wallH.toFixed(1)+'m'; isoUpdate() }
  if(e.target.classList.contains('srch')){const q=e.target.value.trim().toLowerCase().replace(/\s+/g,''),box=e.target.parentElement.querySelector('.results');
    if(!q){box.classList.remove('on');return}
    const ch=courseHits(q);
    const hit=ROOMS.filter(r=>(r.b+r.no+r.name+r.pn+dept(r)+(r.x&&r.x.dept||'')+(r.tt?r.tt.regs.map(g=>g.dept+g.nm).join(''):'')+r.type).toLowerCase().replace(/\s+/g,'').includes(q)).slice(0,8);
    const rh=hit.map(r=>'<button data-k="'+esc(r.key)+'">'+esc(disp(r))+'<small>'+esc(where(r)+' · '+r.type+(dept(r)?' · '+dept(r):''))+'</small></button>').join('');
    const chh=ch.list.map(o=>'<button data-ttroom="'+esc(o.k)+'" data-ttgo="1" data-ttsj="'+o.si+'">'+esc(TTX.S[o.si])+'<span class="tg">'+esc(o.k.replace('|',' '))+'</span><small>'+esc(o.nm+' · '+o.when+' · '+o.depts)+'</small></button>').join('');
    box.innerHTML=(chh?'<h5>수업 '+ch.total+'건'+(ch.total>ch.list.length?' (앞 '+ch.list.length+'건)':'')+' · 누르면 그 강의실 시간표</h5>'+chh:'')+(rh?'<h5>실</h5>'+rh:'')||'<p>찾는 실이나 수업이 없습니다. 호실 번호, 실 이름, 수업 이름 일부로 다시 찾아보세요.</p>';
    box.classList.add('on')}});
/* 수업 이름으로 강의실 찾기: (수업, 강의실)마다 요일·교시를 묶어 보여 줍니다 */
const TTN=TTX.S.map(x=>x.toLowerCase().replace(/\s+/g,''));
function ttWhen(sl){const by={}; sl.forEach(x=>{(by[x[0]]=by[x[0]]||new Set()).add(x[1])});
  return TTD.filter(d=>by[d]).map(d=>{const ps=[...by[d]].sort((a,b)=>a-b), rg=[]; ps.forEach(p=>{const l=rg[rg.length-1]; if(l&&p===l[1]+1) l[1]=p; else rg.push([p,p])});
    return d+' '+rg.map(r=>r[0]===r[1]?r[0]:r[0]+'~'+r[1]).join('·')}).join(', ')+'교시'}
function courseHits(q){
  const sis=TTN.map((n,i)=>n.includes(q)?i:-1).filter(i=>i>=0); if(!sis.length) return {list:[],total:0};
  const set=new Set(sis), out=[];
  Object.keys(TTX.rooms).forEach(k=>{const R=TTX.rooms[k], by={};
    R.sl.forEach(x=>{ if(set.has(x[2])) (by[x[2]]=by[x[2]]||[]).push(x) });
    Object.keys(by).forEach(si=>{const sl=by[si]; out.push({k,si:+si,nm:R.nm,n:sl.length,when:ttWhen(sl),
      depts:[...new Set(sl.map(x=>TTX.D[x[3]]))].join(', ')})})});
  out.sort((a,b)=>(TTN[a.si].indexOf(q)===0?0:1)-(TTN[b.si].indexOf(q)===0?0:1)||TTX.S[a.si].localeCompare(TTX.S[b.si],'ko')||b.n-a.n);
  return {list:out.slice(0,12),total:out.length}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.scene')&&!e.target.closest('input')){drag={x:e.clientX,y:e.clientY,rz:S.rz,rx:S.rx};moved=false}});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;
  S.rz=drag.rz+dx*.35;S.rx=Math.max(20,Math.min(80,drag.rx-dy*.3));spin()});
/* 평면도 마우스 조작: 휠 = 확대·축소(마우스 위치 기준), 끌기 = 회전·기울기(2.5D) 또는 이동(평면), 오른쪽 버튼 끌기 = 이동 */
let pdrag=null, pmoved=false, praf=0;
document.addEventListener('pointerdown',e=>{const w=e.target.closest('#view-plan .plan-wrap'); if(!w) return;
  pdrag={w,x:e.clientX,y:e.clientY,rot:S.isoRot,tilt:S.isoTilt,sl:w.scrollLeft,st:w.scrollTop,pan:e.button===2||e.shiftKey||!w.classList.contains('iso')}; pmoved=false;
  w.style.cursor=pdrag.pan?'grabbing':'move'});
window.addEventListener('pointermove',e=>{ if(!pdrag) return; const dx=e.clientX-pdrag.x, dy=e.clientY-pdrag.y; if(Math.abs(dx)+Math.abs(dy)>4) pmoved=true; if(!pmoved) return;
  if(pdrag.pan){pdrag.w.scrollLeft=pdrag.sl-dx; pdrag.w.scrollTop=pdrag.st-dy; return}
  S.isoRot=Math.round((pdrag.rot+dx*0.35)*10)/10; S.isoRot=((S.isoRot+180)%360+360)%360-180;
  S.isoTilt=Math.max(.3,Math.min(.92,pdrag.tilt-dy*0.003));
  if(!praf) praf=requestAnimationFrame(()=>{praf=0; isoUpdate()}) });
window.addEventListener('pointerup',()=>{ if(!pdrag) return; pdrag.w.style.cursor=''; pdrag=null; setTimeout(()=>{pmoved=false},0) });
document.addEventListener('contextmenu',e=>{ if(e.target.closest('#view-plan .plan-wrap')) e.preventDefault() });
document.addEventListener('dblclick',e=>{ const w=e.target.closest('#view-plan .plan-wrap'); if(!w) return; e.preventDefault();
  S.zoom=1; S.isoRot=-22; S.isoTilt=.56; if(w.classList.contains('iso')) isoUpdate(); applyZoom(); w.scrollLeft=0; w.scrollTop=0 });
document.addEventListener('wheel',e=>{ const w=e.target.closest('#view-plan .plan-wrap'); if(!w) return; e.preventDefault();
  const sv=w.querySelector('svg'); if(!sv) return; const r=w.getBoundingClientRect(), ox=e.clientX-r.left, oy=e.clientY-r.top;
  const px=(w.scrollLeft+ox)/sv.clientWidth, py=(w.scrollTop+oy)/sv.clientHeight;
  S.zoom=Math.max(1,Math.min(6,S.zoom*Math.exp(-e.deltaY*0.0015))); applyZoom();
  w.scrollLeft=px*sv.clientWidth-ox; w.scrollTop=py*sv.clientHeight-oy },{passive:false});
document.addEventListener('wheel',e=>{if(e.target.closest('#scene2')){e.preventDefault();zoomTo(S.bzT*Math.exp(-e.deltaY*.0018))}},{passive:false});
window.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>{moved=false},0)});
window.addEventListener('resize',()=>{if(S.tab==='map')draw()});
if(VW_TRY&&!(typeof vw!=='undefined'&&vw.Map)) mapState='fail';
draw();
})();
